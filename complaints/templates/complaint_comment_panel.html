<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    {% for i in complaints %}
        Описание: {{i.description}}<br>
        От: {{i.author}}<br>
        На: <a href="/question/{{i.comment.question.id}}"> {{i.comment.text}}</a> <br>
        <a href="/accept/?complaint_id={{i.id}}&to=/complaint/panel/comments">Принять</a> |
        <a href="/decline/?complaint_id={{i.id}}&to=/complaint/panel/comments">Отклонить</a>
        <hr>
    {% endfor %}
</body>
</html>
