{% load static %}
<div class="complain-overlay" id="complainCommentOverlay">
  <div class="complain-backdrop" onclick="closeComplainCommentOverlay()"></div>
  <div class="complain-modal">
    <div class="complain-header">
      <span class="complain-title">Пожаловаться на комментарий</span>
    </div>

    <div class="complain-body">
      <p class="complain-subtitle">Укажите причину жалобы:</p>

      <div class="complain-reasons">
        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="spam">
          <span class="reason-radio"></span>
          <span class="reason-text">Спам или реклама</span>
        </label>

        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="offensive">
          <span class="reason-radio"></span>
          <span class="reason-text">Оскорбительный контент</span>
        </label>

        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="harassment">
          <span class="reason-radio"></span>
          <span class="reason-text">Преследование или травля</span>
        </label>

        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="misinformation">
          <span class="reason-radio"></span>
          <span class="reason-text">Ложная информация</span>
        </label>

        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="inappropriate">
          <span class="reason-radio"></span>
          <span class="reason-text">Неприемлемый контент (18+)</span>
        </label>

        <label class="complain-reason">
          <input type="radio" name="complain_comment_reason" value="other">
          <span class="reason-radio"></span>
          <span class="reason-text">Другое</span>
        </label>
      </div>

      <textarea class="complain-textarea" placeholder="Опишите подробнее (необязательно)..."></textarea>
    </div>

    <div class="complain-footer">
      <button class="complain-cancel-btn" onclick="closeComplainCommentOverlay()">Отмена</button>
      <button class="complain-submit-btn">Отправить жалобу</button>
    </div>
  </div>
</div>

<script>
  function openComplainCommentOverlay() {
    document.getElementById('complainCommentOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeComplainCommentOverlay() {
    document.getElementById('complainCommentOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }
</script>
