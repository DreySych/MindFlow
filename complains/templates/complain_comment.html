{% load static %}
<div class="complain-overlay" id="complainCommentOverlay">
  <div class="complain-backdrop" onclick="closeComplainCommentOverlay()"></div>
  <div class="complain-modal">
    <!-- Форма жалобы -->
    <div id="complainCommentForm">
      <div class="complain-header">
        <span class="complain-title">Пожаловаться на комментарий</span>
      </div>

      <div class="complain-body">
        <p class="complain-subtitle">Введите причину жалобы:</p>
        <textarea class="complain-textarea" placeholder="Опишите её здесь"></textarea>
      </div>

      <div class="complain-footer">
        <button class="complain-cancel-btn" onclick="closeComplainCommentOverlay()">Отмена</button>
        <button class="complain-submit-btn" onclick="submitComplainComment()">Отправить жалобу</button>
      </div>
    </div>

    <div id="complainCommentThanks" style="display: none;">
      <div class="complain-header">
        <span class="complain-title">Спасибо что помогаете улучшать сообщество!</span>
      </div>
      <div class="complain-body">
        <p class="complain-subtitle">Ваша жалоба отправлена. Мы рассмотрим её в ближайшее время.</p>
      </div>
      <div class="complain-footer">
        <button class="complain-submit-btn" onclick="closeComplainCommentOverlay()">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
  function openComplainCommentOverlay() {
    document.getElementById('complainCommentOverlay').classList.add('active');
    document.getElementById('complainCommentForm').style.display = 'block';
    document.getElementById('complainCommentThanks').style.display = 'none';
    document.body.style.overflow = 'hidden';
  }

  function closeComplainCommentOverlay() {
    document.getElementById('complainCommentOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  function submitComplainComment() {
    document.getElementById('complainCommentForm').style.display = 'none';
    document.getElementById('complainCommentThanks').style.display = 'block';
  }
</script>
