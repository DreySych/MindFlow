{% load static %}
<header style="position: fixed; top: 0; left: 0; width: 100%; height: 120px; background: #ffffff; border-bottom: 1px solid #E0E0E0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box;">
    <a href="{% url 'index' %}" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="{% static 'images/logo.png' %}" alt="Logo" style="width: 40px; height: 40px;">
        <span style="font-family: 'Mallanna', sans-serif; font-size: 24px; font-weight: 600; color: #000;">KShP</span>
    </a>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; margin: 0 40px;">
        <div style="position: relative; width: 100%; max-width: 400px;">
            <input type="text" id="searchInput" placeholder="Поиск..." style="width: 100%; padding: 10px 16px 10px 40px; border: 1px solid #C6C6C6; border-radius: 20px; font-family: 'Mallanna', sans-serif; font-size: 14px; outline: none;">
            <button style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0;">
                <img src="{% static 'images/loop.png' %}" alt="Search" style="width: 18px; height: 18px;">
            </button>
        </div>
    </div>

    <div style="display: flex; align-items: center; gap: 20px;">
        <button style="background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; gap: 6px; font-family: 'Mallanna', sans-serif; font-size: 14px; color: #000;">
            <img src="{% static 'images/lamp.png' %}" alt="AI" style="width: 20px; height: 20px;">
            <span>ИИ</span>
        </button>

        <a href="{% url 'make_question' %}" style="padding: 10px 20px; background: linear-gradient(to right, #0047AB, #1671FE); color: #ffffff; border: none; border-radius: 20px; font-family: 'Mallanna', sans-serif; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
            <span>+</span> Создать
        </a>

        <a href="{% url 'notifications' %}" style="background: none; border: none; cursor: pointer; padding: 8px;">
            <img src="{% static 'images/notifications.png' %}" alt="Notifications" style="width: 24px; height: 24px;">
        </a>

        <div style="position: relative;">
            <button onclick="toggleProfileMenu()" style="background: none; border: none; cursor: pointer; padding: 0; width: 40px; height: 40px; border-radius: 50%; overflow: hidden;">
                <img src="{% if user.is_authenticated %}{{ user.profile.avatar.url }}{% else %}{% static 'images/default.png' %}{% endif %}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
            </button>
            <div id="profileMenu" style="position: absolute; top: 52px; right: 0; background: #ffffff; border: 1px solid #C6C6C6; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); min-width: 180px; padding: 8px 0; display: none; z-index: 20;">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" style="display: block; padding: 10px 16px; font-family: 'Mallanna', sans-serif; font-size: 15px; color: #000; text-decoration: none; transition: background 0.15s ease;" onmouseover="this.style.background='#F6F6F6'" onmouseout="this.style.background='transparent'">Профиль</a>
                    <a href="{% url 'PM' %}" style="display: block; padding: 10px 16px; font-family: 'Mallanna', sans-serif; font-size: 15px; color: #000; text-decoration: none; transition: background 0.15s ease;" onmouseover="this.style.background='#F6F6F6'" onmouseout="this.style.background='transparent'">Сообщения</a>
                    <a href="{% url 'logout' %}" style="display: block; padding: 10px 16px; font-family: 'Mallanna', sans-serif; font-size: 15px; color: #E53935; text-decoration: none; transition: background 0.15s ease;" onmouseover="this.style.background='#FFF0F0'" onmouseout="this.style.background='transparent'">Выход</a>
                {% else %}
                    <a href="{% url 'login' %}" style="display: block; padding: 10px 16px; font-family: 'Mallanna', sans-serif; font-size: 15px; color: #000; text-decoration: none; transition: background 0.15s ease;" onmouseover="this.style.background='#F6F6F6'" onmouseout="this.style.background='transparent'">Вход</a>
                    <a href="{% url 'signup' %}" style="display: block; padding: 10px 16px; font-family: 'Mallanna', sans-serif; font-size: 15px; color: #000; text-decoration: none; transition: background 0.15s ease;" onmouseover="this.style.background='#F6F6F6'" onmouseout="this.style.background='transparent'">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<script>
    function toggleProfileMenu() {
        const menu = document.getElementById('profileMenu');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('profileMenu');
        const trigger = event.target.closest('button');
        if (!event.target.closest('div:has(#profileMenu)')) {
            menu.style.display = 'none';
        }
    });
</script>
