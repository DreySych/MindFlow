image: python:3.12

stages:
  - lint
  - test
  - docs

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DJANGO_SETTINGS_MODULE: "The_Final_Build.settings"
  SECRET_KEY: "ci-secret-key"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  OPENROUTER_API_KEY: ""

cache:
  paths:
    - .cache/pip/

before_script:
  - python3 --version
  - python3 -m venv .venv
  - source .venv/bin/activate
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

lint:
  stage: lint
  script:
    - python -m flake8 .
    - python -m pylint ai main questions users notifications complaints private_messages --ignore=migrations --fail-under=8.0

test:
  stage: test
  script:
    - python -m coverage run --source='.' manage.py test
    - python -m coverage report
    - python -m coverage xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docs:
  stage: docs
  script:
    - python -m sphinx -W -b html docs/source docs/build/html
  artifacts:
    when: always
    paths:
      - docs/build/html