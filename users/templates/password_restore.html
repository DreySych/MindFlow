<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <script>
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;600;500;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/password_restore.css' %}">
    <title>Восстановление пароля</title>
</head>
<body>

    <button onclick="toggleTheme()" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid var(--border-primary);
        background: var(--bg-secondary);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 20px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    ">
        🌓
    </button>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h1 class="auth-title">Восстановление пароля</h1>
            <p class="auth-description">
                Введите вашу почту и мы отправим вам код для восстановления доступа к аккаунту.
            </p>

            <form id="restoreForm" method="POST">
                {% csrf_token %}

                <div class="input-group">
                    {{ form.email }}
                </div>

                <div class="auth-links">
                    <a href="{% url 'login' %}" class="auth-link">Вспомнили пароль? Войти</a>
                </div>

                <button type="submit" class="auth-button">Отправить код</button>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <span class="notification-icon">✕</span>
        <span class="notification-message">Ошибка</span>
        <span class="notification-close" onclick="hideNotification()">✕</span>
    </div>

    <script>
        function toggleTheme() {
            if (document.body.classList.contains('light-theme')) {
                document.body.classList.remove('light-theme');
                localStorage.setItem('mindflow-theme', 'dark');
            } else {
                document.body.classList.add('light-theme');
                localStorage.setItem('mindflow-theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('mindflow-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            } else if (savedTheme === 'dark') {
                document.body.classList.remove('light-theme');
            } else {
                // По умолчанию светлая тема
                document.body.classList.add('light-theme');
            }
        }

        const notification = document.getElementById('notification');

        function showNotification(message, type = 'error') {
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✓' : '✕';
            notification.querySelector('.notification-message').textContent = message;
            notification.className = 'notification ' + type + ' show';
            setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        // Загрузка темы при загрузке страницы
        loadTheme();

        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message|escapejs }}', '{% if message.tags == "success" %}success{% else %}error{% endif %}');
            {% endfor %}
        {% endif %}

        document.getElementById('restoreForm').addEventListener('submit', function(e) {
            const email = document.querySelector('[name="email"]').value.trim();

            if (!email) {
                e.preventDefault();
                document.querySelector('[name="email"]').classList.add('error');
                showNotification('Введите почту');
                setTimeout(() => document.querySelector('[name="email"]').classList.remove('error'), 500);
            }
        });
    </script>
</body>
</html>
