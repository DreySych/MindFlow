{% load static %}
{% load custom_filters %}
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-backdrop"></div>
  <div class="chat-modal">
    <div class="chat-modal-header">
      <div class="chat-user-info">
        <img src="{% static 'images/default.png' %}" alt="Аватар" class="chat-modal-avatar">
        <span class="chat-modal-username" id="chatUserName">Выберите чат</span>
      </div>
      <button class="chat-modal-close" onclick="closeChatOverlay()">
        <img src="{% static 'images/close_cross.png' %}" alt="Закрыть">
      </button>
    </div>

    <div class="chat-modal-messages">
        <p class="chat-empty-text">Выберите друга, чтобы открыть чат</p>
    </div>

    <div class="chat-modal-input-area">

      <input type="text"
             id="chat-message-input"
             placeholder="Напишите сообщение..."
             autocomplete="off">

      <button type="button"
              id="chat-message-submit"
              class="chat-modal-send-btn">

          <img src="{% static 'images/send.png' %}" alt="Отправить">

      </button>

  </div>
  </div>
    </div>

<script>
let chatSocket = null;
let selectedUserId = null;
const currentUserId = "{{ request.user.id }}";

function openChatOverlay(userId, username) {
    selectedUserId = userId;
    localStorage.setItem('chatOpen', 'true');
    localStorage.setItem('chatUserId', userId);
    localStorage.setItem('chatUsername', username);
    document.getElementById('chatOverlay').classList.add('active');
    document.getElementById('chatUserName').textContent = username;
    document.body.style.overflow = '';

    loadChatMessages(userId);
    connectChatSocket(userId);
}

function closeChatOverlay() {
    document.getElementById('chatOverlay').classList.remove('active');
    localStorage.removeItem('chatOpen');
    localStorage.removeItem('chatUserId');
    localStorage.removeItem('chatUsername');
    if (chatSocket) {
        chatSocket.close();
        chatSocket = null;
    }
}

function loadChatMessages(userId) {
    fetch('/messages/' + userId + '/messages/')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            const messagesContainer = document.querySelector('.chat-modal-messages');
            messagesContainer.innerHTML = '';

            if (!data.ok || data.messages.length === 0) {
                messagesContainer.innerHTML = '<p class="chat-empty-text">Сообщений пока нет</p>';
                return;
            }

            data.messages.forEach(function(message) {
                addMessageToChat(message.text, message.sender_id, message.time);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
}

function connectChatSocket(userId) {
    if (chatSocket) {
        chatSocket.close();
    }

    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";

    chatSocket = new WebSocket(
        protocol + window.location.host + "/ws/chat/" + userId + "/"
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        addMessageToChat(data.message, data.sender_id, data.time);
    };
}

function addMessageToChat(text, senderId, time) {
    const messagesContainer = document.querySelector('.chat-modal-messages');

    if (messagesContainer.querySelector('.chat-empty-text')) {
        messagesContainer.innerHTML = '';
    }

    let messageClass = 'chat-message-other';

    if (senderId == currentUserId) {
        messageClass = 'chat-message-my';
    }

    const messageHtml = `
        <div class="chat-message ${messageClass}">
            <div class="chat-message-bubble">
                <p>${text}</p>
                <span class="chat-message-time">${time}</span>
            </div>
        </div>
    `;

    messagesContainer.innerHTML += messageHtml;
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

document.getElementById('chat-message-submit').onclick = function() {
    const input = document.getElementById('chat-message-input');
    const message = input.value;

    if (!chatSocket || message.trim() === '') {
        return;
    }

    chatSocket.send(JSON.stringify({
        'message': message
    }));

    input.value = '';
};
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);

    const chatId = params.get('open_chat');
    const chatUsername = params.get('chat_username');

    if (chatId) {
        openChatOverlay(chatId, chatUsername);
    }
});
document.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('chatOpen') === 'true') {
        const userId = localStorage.getItem('chatUserId');
        const username = localStorage.getItem('chatUsername');

        if (userId && username) {
            openChatOverlay(userId, username);
        }
    }
});
</script>
