{% load static %}
{% load custom_filters %}
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-backdrop"></div>
  <div class="chat-modal">
    <div class="chat-modal-header">
      <div class="chat-user-info">
          {% if subscription.user2.image %}
            <img src="{{ subscription.user2.image.url }}" alt="" class="chat-modal-avatar" id="chatAvatar">
          {% else %}
            <img src="{% static 'images/default.png' %}" alt="" class="chat-modal-avatar" id="chatAvatar">
          {% endif %}
        <span class="chat-modal-username" id="chatUserName">Выберите чат</span>
      </div>
      <button class="chat-modal-close" onclick="closeChatOverlay()">
        <img src="{% static 'images/close_cross.png' %}" alt="Закрыть">
      </button>
    </div>

    <div class="chat-modal-messages">
        <p class="chat-empty-text">Выберите друга, чтобы открыть чат</p>
    </div>

    <div class="chat-modal-input-area">
      <input type="text"
             id="chat-message-input"
             placeholder="Напишите сообщение..."
             autocomplete="off">

      <button type="button"
              id="chat-message-submit"
              class="chat-modal-send-btn">
          <img src="{% static 'images/send.png' %}" alt="Отправить">
      </button>
    </div>
  </div>
</div>

<script>
let chatSocket = null;
let selectedUserId = null;
let chatPage = 1;
let chatHasMore = false;
let chatLoading = false;
const currentUserId = "{{ request.user.id }}";
const isAuthenticated = {{ request.user.is_authenticated|yesno:"true,false" }};
const isUserActive = {{ request.user.active|yesno:"true,false" }};
const defaultAvatarUrl = "{% static 'images/default.png' %}";

function showError(text) {
    const errorBox = document.createElement('div');
    errorBox.textContent = text;
    errorBox.style.position = 'fixed';
    errorBox.style.top = '20px';
    errorBox.style.right = '20px';
    errorBox.style.background = getComputedStyle(document.documentElement).getPropertyValue('--danger-primary');
    errorBox.style.color = getComputedStyle(document.documentElement).getPropertyValue('--text-primary');
    errorBox.style.padding = '14px 18px';
    errorBox.style.borderRadius = '12px';
    errorBox.style.zIndex = '99999';
    errorBox.style.fontSize = '14px';
    document.body.appendChild(errorBox);
    setTimeout(function() {
        errorBox.remove();
    }, 3000);
}

function saveChatState(userId, username, avatarUrl) {
    localStorage.setItem('chatOpen', 'true');
    localStorage.setItem('chatUserId', userId);
    localStorage.setItem('chatUsername', username || 'Пользователь');

    if (avatarUrl) {
        localStorage.setItem('chatAvatarUrl', avatarUrl);
    } else {
        localStorage.removeItem('chatAvatarUrl');
    }
}

function openChatOverlay(userId, username, avatarUrl = null) {
    selectedUserId = userId;
    saveChatState(userId, username, avatarUrl);

    document.getElementById('chatOverlay').classList.add('active');
    document.getElementById('chatUserName').textContent = username || 'Пользователь';
    document.getElementById('chatAvatar').src = avatarUrl || defaultAvatarUrl;

    loadChatMessages(userId);
    connectChatSocket(userId);
}

function closeChatOverlay() {
    document.getElementById('chatOverlay').classList.remove('active');
    localStorage.removeItem('chatOpen');
    localStorage.removeItem('chatUserId');
    localStorage.removeItem('chatUsername');
    localStorage.removeItem('chatAvatarUrl');

    if (chatSocket) {
        chatSocket.close();
        chatSocket = null;
    }
}

function loadChatMessages(userId) {
    chatPage = 1;
    chatHasMore = false;
    chatLoading = true;

    fetch('/messages/' + userId + '/messages/?page=1')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            const messagesContainer = document.querySelector('.chat-modal-messages');

            messagesContainer.innerHTML = '';

            if (!data.ok || data.messages.length === 0) {
                messagesContainer.innerHTML =
                    '<p class="chat-empty-text">Сообщений пока нет</p>';

                chatLoading = false;
                return;
            }

            chatHasMore = data.has_more;
            chatPage = data.next_page;


            data.messages.forEach(function(message) {
                addMessageToChat(
                    message.text,
                    message.sender_id,
                    message.time,
                    false
                );
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            chatLoading = false;
        });
}



function loadOldMessages() {
    if (!selectedUserId || !chatHasMore || chatLoading) {
        return;
    }

    chatLoading = true;

    const container = document.querySelector('.chat-modal-messages');

    const oldHeight = container.scrollHeight;

    fetch('/messages/' + selectedUserId + '/messages/?page=' + chatPage)
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {


            data.messages.forEach(function(message) {
                addMessageToChat(
                    message.text,
                    message.sender_id,
                    message.time,
                    true
                );
            });

            chatHasMore = data.has_more;
            chatPage = data.next_page;


            container.scrollTop =
                container.scrollHeight - oldHeight;

            chatLoading = false;
        });
}

document.querySelector('.chat-modal-messages').addEventListener('scroll', function() {
    if (this.scrollTop < 50) {
        loadOldMessages();
    }
});

function connectChatSocket(userId) {
    if (chatSocket) {
        chatSocket.close();
    }

    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    chatSocket = new WebSocket(protocol + window.location.host + '/ws/chat/' + userId + '/');

    chatSocket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        addMessageToChat(
            data.message,
            data.sender_id,
            data.time,
            false
        );

        const messagesContainer =
            document.querySelector('.chat-modal-messages');

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;
    };
}

function addMessageToChat(text, senderId, time, prepend) {
    const messagesContainer =
        document.querySelector('.chat-modal-messages');

    if (messagesContainer.querySelector('.chat-empty-text')) {
        messagesContainer.innerHTML = '';
    }

    let messageClass = 'chat-message-other';

    if (senderId == currentUserId) {
        messageClass = 'chat-message-my';
    }

    const messageBlock = document.createElement('div');
    messageBlock.className =
        'chat-message ' + messageClass;

    const bubble = document.createElement('div');
    bubble.className = 'chat-message-bubble';

    const textElement = document.createElement('p');
    textElement.textContent = text;

    const timeElement = document.createElement('span');
    timeElement.className = 'chat-message-time';
    timeElement.textContent = time;

    bubble.appendChild(textElement);
    bubble.appendChild(timeElement);

    messageBlock.appendChild(bubble);

    if (prepend) {
        messagesContainer.prepend(messageBlock);
    } else {
        messagesContainer.appendChild(messageBlock);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function sendChatMessage() {
    if (!isAuthenticated) {
        window.location.href = '/account/login/?next=' + encodeURIComponent(window.location.pathname);
        return;
    }

    if (!isUserActive) {
        showError('Вы заблокированы');
        return;
    }

    const input = document.getElementById('chat-message-input');
    const message = input.value.trim();

    if (!chatSocket || !message) {
        return;
    }

    chatSocket.send(JSON.stringify({
        message: message
    }));
    input.value = '';
}

function openSavedChat() {
    const params = new URLSearchParams(window.location.search);
    const chatId = params.get('open_chat') || localStorage.getItem('chatUserId');
    const username = params.get('chat_username') || localStorage.getItem('chatUsername');
    const avatarUrl = params.get('chat_avatar') || localStorage.getItem('chatAvatarUrl');

    if (chatId && username && (params.get('open_chat') || localStorage.getItem('chatOpen') === 'true')) {
        openChatOverlay(chatId, username, avatarUrl);
    }
}

document.getElementById('chat-message-submit').onclick = sendChatMessage;

document.getElementById('chat-message-input').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        sendChatMessage();
    }
});

document.addEventListener('DOMContentLoaded', openSavedChat);
</script>
