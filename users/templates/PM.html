{% load static %}
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-backdrop"></div>
  <div class="chat-modal">
    <div class="chat-modal-header">
      <div class="chat-user-info">
        <img src="{% static 'images/default.png' %}" alt="Аватар" class="chat-modal-avatar">
        <span class="chat-modal-username">{{ other_user.username }}</span>
      </div>
      <button class="chat-modal-close" onclick="closeChatOverlay()">
        <img src="{% static 'images/close_cross.png' %}" alt="Закрыть">
      </button>
    </div>

    <div class="chat-modal-messages">
        {% for message in messages %}

            {% if message.sender.id == request.user.id %}
                <div class="chat-message chat-message-my">
            {% else %}
                <div class="chat-message chat-message-other">
            {% endif %}

                    <div class="chat-message-bubble">
                        <p>{{ message.text }}</p>

                        <span class="chat-message-time">
                            {{ message.created_at|date:"H:i" }}
                        </span>
                    </div>

                </div>

        {% empty %}
            <p class="chat-empty-text">Сообщений пока нет</p>
        {% endfor %}
    </div>

    <div class="chat-modal-input-area">

      <input type="text"
             id="chat-message-input"
             placeholder="Напишите сообщение..."
             autocomplete="off">

      <button type="button"
              id="chat-message-submit"
              class="chat-modal-send-btn">

          <img src="{% static 'images/send.png' %}" alt="Отправить">

      </button>

  </div>
  </div>
    </div>

<script>
    const userId = "{{ other_user.id|default:'' }}";
    const currentUserId = "{{ request.user.id }}";

    if (userId !== "") {
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";

        const chatSocket = new WebSocket(
            protocol + window.location.host + "/ws/chat/" + userId + "/"
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const messagesContainer = document.querySelector('.chat-modal-messages');

            let messageClass = 'chat-message-other';

            if (data.sender_id == currentUserId) {
                messageClass = 'chat-message-my';
            }

            const messageHtml = `
                <div class="chat-message ${messageClass}">
                    <div class="chat-message-bubble">
                        <p>${data.message}</p>
                        <span class="chat-message-time">${data.time}</span>
                    </div>
                </div>
            `;

            messagesContainer.innerHTML += messageHtml;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        document.querySelector('#chat-message-submit').onclick = function() {
            const input = document.querySelector('#chat-message-input');
            const message = input.value;

            if (message.trim() === '') {
                return;
            }

            chatSocket.send(JSON.stringify({
                'message': message
            }));

            input.value = '';
        };
    }
</script>
</div>
