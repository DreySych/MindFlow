<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    {% load custom_filters %}
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;600;500;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
    <link rel="stylesheet" href="{% static 'css/basic.css' %}">
    <title>Регистрация</title>
</head>
<body>

    <a href="{% url 'login' %}" class="back-button">
        <img src="{% static 'images/back.png' %}" alt="Назад" class="back-icon">
        <span>Назад</span>
    </a>
    <button onclick="toggleTheme()" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 2px solid var(--border-primary);
        background: var(--bg-secondary);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 20px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    ">
        🌓
    </button>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h1 class="auth-title">Регистрация</h1>

            <form id="registerForm" method="POST" action="{% url 'signup' %}">
                {% csrf_token %}

                <div class="input-group">
                    <input type="text" class="input-field" name="username" placeholder="Придумайте логин" required minlength="3">
                </div>

                <div class="input-group">
                    <input type="email" class="input-field" name="email" placeholder="Введите почту" required>
                </div>

                <div class="input-group">
                    <select class="input-field" name="gender">
                        <option value="" disabled selected>Выберите пол</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                </div>

                <div class="input-group">
                    <input type="date" class="input-field" name="birthdate">
                </div>

                <div class="input-group">
                    <input type="password" class="input-field" name="password" placeholder="Придумайте пароль" required minlength="6">
                </div>

                <div class="input-group">
                    <input type="password" class="input-field" name="password_confirm" placeholder="Повторите пароль" required>
                </div>

                <div class="auth-links">
                    <a href="{% url 'login' %}" class="auth-link">Уже есть аккаунт? Войти</a>
                </div>

                <button type="submit" class="auth-button">Создать аккаунт</button>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <span class="notification-icon">✕</span>
        <span class="notification-message">Ошибка регистрации</span>
        <span class="notification-close" onclick="hideNotification()">✕</span>
    </div>


    <script>
        function toggleTheme() {
            if (document.body.classList.contains('light-theme')) {
                document.body.classList.remove('light-theme');
                localStorage.setItem('mindflow-theme', 'dark');
            } else {
                document.body.classList.add('light-theme');
                localStorage.setItem('mindflow-theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('mindflow-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            } else if (savedTheme === 'dark') {
                document.body.classList.remove('light-theme');
            } else {
                document.body.classList.add('light-theme');
            }
        }

        loadTheme();

        const notification = document.getElementById('notification');
        const registerForm = document.getElementById('registerForm');

        function showNotification(message, type = 'error') {
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✓' : '✕';
            notification.querySelector('.notification-message').textContent = message;
            notification.className = 'notification ' + type + ' show';
            setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        function showError(input) {
            input.classList.add('error');
            setTimeout(() => input.classList.remove('error'), 500);
        }

        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message }}', '{% if message.tags == "success" %}success{% else %}error{% endif %}');
            {% endfor %}
        {% endif %}

        registerForm.addEventListener('submit', function(e) {
            const password = document.querySelector('[name="password"]').value;
            const confirmPassword = document.querySelector('[name="password_confirm"]').value;
            const username = document.querySelector('[name="username"]').value;

            if (username.length < 3) {
                e.preventDefault();
                showError(document.querySelector('[name="username"]'));
                showNotification('Логин должен быть не менее 3 символов');
                return;
            }

            if (password !== confirmPassword) {
                e.preventDefault();
                showError(document.querySelector('[name="password"]'));
                showError(document.querySelector('[name="password_confirm"]'));
                showNotification('Пароли не совпадают');
                return;
            }

            if (password.length < 6) {
                e.preventDefault();
                showError(document.querySelector('[name="password"]'));
                showNotification('Пароль должен быть не менее 6 символов');
                return;
            }
        });

        function fixFooter() {
            const footer = document.querySelector('footer');
            if (!footer) return;

            const windowHeight = window.innerHeight;
            const bodyHeight = document.body.scrollHeight;
            const footerHeight = footer.offsetHeight;

            if (bodyHeight + footerHeight < windowHeight) {
                const wrapper = document.querySelector('.auth-wrapper');
                if (wrapper) {
                    const neededHeight = windowHeight - footerHeight - 100;
                    wrapper.style.minHeight = neededHeight + 'px';
                }
            }
        }

        window.addEventListener('load', fixFooter);
        window.addEventListener('resize', fixFooter);
        setTimeout(fixFooter, 100);
    </script>
</body>
</html>
