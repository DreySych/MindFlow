<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;600;500;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/password_restore_code.css' %}">
    <title>Код подтверждения | MindFlow</title>


</head>
<body>


    <div class="auth-wrapper">
        <div class="auth-container">
            <h1 class="auth-title">Код подтверждения</h1>
            <p class="auth-description">
                Введите 6-значный код из письма. Код действителен 10 минут.
            </p>

            <form id="codeForm" method="POST">
                {% csrf_token %}

                <div class="input-group">
                    {{ form.code }}
                </div>

                <div class="auth-links">
                    <a href="{% url 'password_restore' %}" class="auth-link">Отправить код повторно</a>
                </div>

                <button type="submit" class="auth-button">Подтвердить</button>
            </form>

            <div class="timer">
                Код действителен 10 минут
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <span class="notification-icon">✕</span>
        <span class="notification-message">Ошибка</span>
        <span class="notification-close" onclick="hideNotification()">✕</span>
    </div>



    <script>
        const notification = document.getElementById('notification');
        const codeInput = document.querySelector('[name="code"]');

        function showNotification(message, type = 'error') {
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✓' : '✕';
            notification.querySelector('.notification-message').textContent = message;
            notification.className = 'notification ' + type + ' show';
            setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message|escapejs }}', '{% if message.tags == "success" %}success{% else %}error{% endif %}');
            {% endfor %}
        {% endif %}

        // Только цифры
        codeInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('codeForm').addEventListener('submit', function(e) {
            const code = codeInput.value.trim();

            if (!code || code.length !== 6) {
                e.preventDefault();
                codeInput.classList.add('error');
                showNotification('Введите 6-значный код');
                setTimeout(() => codeInput.classList.remove('error'), 500);
            }
        });
    </script>
</body>
</html>
