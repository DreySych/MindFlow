<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;600;500;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/password_restore_new.css' %}">
    <title>Новый пароль | MindFlow</title>

</head>
<body>


    <div class="auth-wrapper">
        <div class="auth-container">
            <h1 class="auth-title">Новый пароль</h1>
            <p class="auth-description">
                Придумайте новый пароль. Минимум 6 символов.
            </p>

            <form id="newPasswordForm" method="POST">
                {% csrf_token %}

                <div class="input-group">
                    {{ form.password1 }}
                </div>

                <div class="input-group">
                    {{ form.password2 }}
                </div>

                <button type="submit" class="auth-button">Сохранить пароль</button>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <span class="notification-icon">✕</span>
        <span class="notification-message">Ошибка</span>
        <span class="notification-close" onclick="hideNotification()">✕</span>
    </div>



    <script>
        const notification = document.getElementById('notification');

        function showNotification(message, type = 'error') {
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✓' : '✕';
            notification.querySelector('.notification-message').textContent = message;
            notification.className = 'notification ' + type + ' show';
            setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message|escapejs }}', '{% if message.tags == "success" %}success{% else %}error{% endif %}');
            {% endfor %}
        {% endif %}

        document.getElementById('newPasswordForm').addEventListener('submit', function(e) {
            const password1 = document.querySelector('[name="password1"]').value;
            const password2 = document.querySelector('[name="password2"]').value;

            if (!password1 || !password2) {
                e.preventDefault();
                if (!password1) document.querySelector('[name="password1"]').classList.add('error');
                if (!password2) document.querySelector('[name="password2"]').classList.add('error');
                showNotification('Заполните все поля');
                setTimeout(() => {
                    document.querySelectorAll('.input-field').forEach(input => input.classList.remove('error'));
                }, 500);
                return;
            }

            if (password1 !== password2) {
                e.preventDefault();
                document.querySelector('[name="password1"]').classList.add('error');
                document.querySelector('[name="password2"]').classList.add('error');
                showNotification('Пароли не совпадают');
                setTimeout(() => {
                    document.querySelectorAll('.input-field').forEach(input => input.classList.remove('error'));
                }, 500);
                return;
            }

            if (password1.length < 6) {
                e.preventDefault();
                document.querySelector('[name="password1"]').classList.add('error');
                document.querySelector('[name="password2"]').classList.add('error');
                showNotification('Пароль минимум 6 символов');
                setTimeout(() => {
                    document.querySelectorAll('.input-field').forEach(input => input.classList.remove('error'));
                }, 500);
            }
        });
    </script>
</body>
</html>
