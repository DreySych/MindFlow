<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;600;500;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
    <title>Вход | MindFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            color: #1a1a2e;
            display: flex;
            flex-direction: column;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 2px solid #D1D9E6;
            box-shadow: 0 4px 20px rgba(74,144,226,0.1);
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #D1D9E6;
            border-radius: 25px;
            background: #F0F4F8;
            color: #1a1a2e;
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field::placeholder {
            color: #9CA3AF;
        }

        .input-field:focus {
            border-color: #4A90E2;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(74,144,226,0.2);
        }

        .input-field.error {
            border-color: #EF4444;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

        .auth-links {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .auth-link {
            color: #6B7280;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .auth-link:hover {
            color: #4A90E2;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #ffffff;
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(74,144,226,0.3);
        }

        .auth-button:hover {
            background: linear-gradient(135deg, #357ABD 0%, #2E6BAA 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74,144,226,0.4);
        }

        .notification {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #ffffff;
            border: 2px solid #D1D9E6;
            padding: 16px 24px;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .notification.success {
            border-color: #10B981;
            color: #10B981;
        }

        .notification.error {
            border-color: #EF4444;
            color: #EF4444;
        }

        .notification-icon {
            font-size: 18px;
        }

        .notification-close {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .notification-close:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h1 class="auth-title">Вход</h1>

            <form id="loginForm" method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="input-group">
                    <input type="email" class="input-field" name="email" placeholder="Введите почту" required>
                </div>

                <div class="input-group">
                    <input type="password" class="input-field" name="password" placeholder="Введите пароль" required>
                </div>

                <div class="auth-links">
                    <a href="#" class="auth-link">Забыли пароль?</a>
                    <a href="{% url 'signup' %}" class="auth-link">Нет аккаунта? Создать</a>
                </div>

                <button type="submit" class="auth-button">Войти</button>
            </form>
        </div>
    </div>


    <div class="notification" id="notification">
        <span class="notification-icon">✕</span>
        <span class="notification-message">Неверная почта или пароль</span>
        <span class="notification-close" onclick="hideNotification()">✕</span>
    </div>

    {% include 'footer.html' %}

    <script>
        const notification = document.getElementById('notification');
        const loginForm = document.getElementById('loginForm');

        function showNotification(message, type = 'error') {
            const icon = notification.querySelector('.notification-icon');
            icon.textContent = type === 'success' ? '✓' : '✕';
            notification.querySelector('.notification-message').textContent = message;
            notification.className = 'notification ' + type + ' show';
            setTimeout(hideNotification, 5000);
        }

        function hideNotification() {
            notification.classList.remove('show');
        }

        function showError(input) {
            input.classList.add('error');
            setTimeout(() => input.classList.remove('error'), 500);
        }

        {% if messages %}
            {% for message in messages %}
                showNotification('{{ message }}', '{% if message.tags == "success" %}success{% else %}error{% endif %}');
            {% endfor %}
        {% endif %}

        loginForm.addEventListener('submit', function(e) {
            const email = document.querySelector('[name="email"]').value.trim();
            const password = document.querySelector('[name="password"]').value.trim();

            if (!email || !password) {
                e.preventDefault();
                if (!email) showError(document.querySelector('[name="email"]'));
                if (!password) showError(document.querySelector('[name="password"]'));
                showNotification('Заполните все поля');
            }
        });
    </script>
</body>
</html>
