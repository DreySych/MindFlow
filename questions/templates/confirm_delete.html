{% load static %}
<div class="complain-overlay" id="confirmDeleteOverlay" style="display: none;">
  <div class="complain-backdrop" onclick="closeConfirmDeleteOverlay()"></div>
  <div class="complain-modal">
    <div id="confirmDeleteForm">
      <div class="complain-header">
        <span class="complain-title">Подтверждение удаления</span>
      </div>
      <div class="complain-body">
        <p class="complain-subtitle">Вы уверены, что хотите удалить этот <span id="deleteItemType">пост</span>?</p>
        <p class="complain-subtitle" style="color: #999; margin-top: 8px;">Это действие невозможно отменить.</p>
      </div>
      <div class="complain-footer">
        <button type="button" class="complain-cancel-btn" onclick="closeConfirmDeleteOverlay()">Отмена</button>
        <button type="button" class="complain-submit-btn" id="confirmDeleteBtn" style="background: linear-gradient(135deg, #e53935 0%, #c62828 100%);">Удалить</button>
      </div>
    </div>
  </div>
</div>

<script>
let pendingDeleteCallback = null;

function showError(text) {
    var errorBox = document.getElementById('globalErrorBox');
    if (errorBox) {
        errorBox.remove();
    }
    errorBox = document.createElement('div');
    errorBox.id = 'globalErrorBox';
    errorBox.textContent = text;
    errorBox.style.position = 'fixed';
    errorBox.style.top = '20px';
    errorBox.style.right = '20px';
    errorBox.style.background = '#ff4d4f';
    errorBox.style.color = 'white';
    errorBox.style.padding = '14px 18px';
    errorBox.style.borderRadius = '12px';
    errorBox.style.zIndex = '99999';
    errorBox.style.fontSize = '14px';
    errorBox.style.fontFamily = 'Mallanna, sans-serif';
    errorBox.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
    document.body.appendChild(errorBox);
    setTimeout(function() {
        if (errorBox) errorBox.remove();
    }, 3000);
}

window.openConfirmDeleteOverlay = function(itemType, onConfirm) {
    {% if not user.is_authenticated %}
        showError('Требуется авторизация');
        return;
    {% elif not user.active %}
        showError('Вы заблокированы');
        return;
    {% endif %}

    var overlay = document.getElementById('confirmDeleteOverlay');
    var itemTypeSpan = document.getElementById('deleteItemType');

    if (itemTypeSpan) {
        itemTypeSpan.textContent = itemType;
    }

    pendingDeleteCallback = onConfirm;

    if (overlay) {
        overlay.style.display = 'flex';
    }
    document.body.style.overflow = 'hidden';
};

window.closeConfirmDeleteOverlay = function() {
    var overlay = document.getElementById('confirmDeleteOverlay');
    if (overlay) {
        overlay.style.display = 'none';
    }
    document.body.style.overflow = '';
    pendingDeleteCallback = null;
};

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var overlay = document.getElementById('confirmDeleteOverlay');
        if (overlay && overlay.style.display === 'flex') {
            closeConfirmDeleteOverlay();
        }
    }
});

document.getElementById('confirmDeleteBtn')?.addEventListener('click', function() {
    if (pendingDeleteCallback) {
        pendingDeleteCallback();
    }
    closeConfirmDeleteOverlay();
});
</script>
