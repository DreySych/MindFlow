<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Создание поста</title>
	{% load static %}
	<script>
		const savedTheme = localStorage.getItem('theme');

		if (savedTheme === 'light') {
			document.documentElement.classList.add('light-theme');
		}
	</script>
	{% load custom_filters %}
	<link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
	<link rel="stylesheet" href="{% static 'css/theme.css' %}">
	<link rel="stylesheet" href="{% static 'css/post.css' %}">
	<link rel="stylesheet" href="{% static 'css/comments.css' %}">
	<link rel="stylesheet" href="{% static 'css/complain.css' %}">
	<link rel="stylesheet" href="{% static 'css/basic.css' %}">
	<link rel="stylesheet" href="{% static 'css/make_edit_question.css' %}">
	<link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
</head>
<body>
{% include 'header.html' %}
{% include 'body.html' %}

<div class="content-wrapper">
	<main>
		<div class="feed">
			<article class="post-detail-card">
				<h1 class="post-form-title">{% if is_edit %}
					Редактировать пост
					{% else %}
					Создать пост
					{% endif %}
				</h1>

				<form id="createPostForm" method="POST" enctype="multipart/form-data">
					{% csrf_token %}

					<div class="form-group">
						<label for="postTitle" class="form-label">
							Заголовок
						</label>
						<input
								type="text"
								id="postTitle"
								name="title"
								maxlength="200"
								required
								value="{{ form.title.value|default:'' }}"
								class="form-input"
						>
					</div>

					<div class="form-group">
						<label for="postImage" class="form-label">Добавить изображение</label>
						<div class="image-upload-area">
							<label id="dropZone" class="image-upload-label">
								<span>📸 Нажмите для загрузки или перетащите изображение сюда</span>
							</label>
							<input
									type="file"
									id="postImage"
									name="images"
									accept="image/*"
									multiple
									style="display: none;"
							>
							<img id="imagePreview"
								 src="{% if is_edit and question_images %}/media/{{ question_images.0 }}{% endif %}"
								 class="image-preview"
								 style="display: {% if is_edit and question_images %}block{% else %}none{% endif %};"
								 alt="Предпросмотр">
						</div>
					</div>

					<div class="form-group">
						<label for="postText" class="form-label">Текстовая область</label>
						<textarea
								id="postText"
								name="description"
								maxlength="5000"
								class="form-textarea"
						>{{ form.description.value|default:'' }}</textarea>
					</div>

					<div class="tag-section">
						<label class="form-label">Тег</label>
						<div class="tag-buttons">
							<button type="button" id="openTagOverlayBtn" class="suggest-tag-btn">Выбрать тег</button>
							<button type="button" id="suggestTagBtn" class="suggest-tag-btn">Предложить тег</button>
						</div>
						<div id="tagWarning" class="tag-warning" style="display: none;"></div>
						<input type="hidden" id="selectedTag" name="tag" value="{{ question.tag|default:'' }}">
					</div>

					<div class="form-actions">
						<button type="button" id="submitBtn" class="submit-btn">{% if is_edit %}
							Сохранить
							{% else %}
							Опубликовать
							{% endif %}
						</button>
					</div>
				</form>
			</article>
		</div>
	</main>
</div>

<!-- Модальное окно для выбора тега -->
<div id="tagOverlay" class="tag-overlay">
	<div class="tag-modal">
		<div class="tag-modal-header">
			<h3 class="tag-modal-title">Выберите тег</h3>
			<button type="button" class="tag-modal-close" id="closeTagOverlayBtn">✕</button>
		</div>
		<div class="tag-modal-body">
			<div id="tagList" class="tag-list"></div>
		</div>
		<div class="tag-modal-footer">
			<button type="button" id="confirmTagBtn" class="tag-confirm-btn">Подтвердить</button>
		</div>
	</div>
</div>

{% include 'footer.html' %}

<script>
	// Получение списка тегов с сервера
	async function get_available_tags() {
		try {
			const response = await fetch('/get_tags/');
			if (!response.ok) throw new Error('Ошибка');
			const data = await response.json();
			return data;
		} catch (error) {
			console.error('Что-то пошло не так:', error);
			return ['Python', 'Дизайн', 'Frontend', 'Backend', 'Фильмы', 'Игры', 'Спорт', 'Другое'];
		}
	}

	// DOM элементы
	const postImageInput = document.getElementById('postImage');
	const imagePreview = document.getElementById('imagePreview');
	const dropZone = document.getElementById('dropZone');
	const submitBtn = document.getElementById('submitBtn');
	const createPostForm = document.getElementById('createPostForm');
	const selectBtn = document.getElementById('openTagOverlayBtn');
	const hiddenInput = document.getElementById('selectedTag');
	const tagWarning = document.getElementById('tagWarning');
	const suggestTagBtn = document.getElementById('suggestTagBtn');

	let availableTags = [];
	let tempSelectedTag = null;
	const savedTagValue = "{{ question.tag|default:'' }}";

	// Предпросмотр изображения
	function previewImage(file) {
		if (!file) return false;
		if (!file.type.startsWith('image/')) {
			alert('Пожалуйста, выберите изображение');
			return false;
		}
		if (file.size > 5 * 1024 * 1024) {
			alert('Размер файла не должен превышать 5 МБ');
			return false;
		}
		const reader = new FileReader();
		reader.onload = function(e) {
			imagePreview.src = e.target.result;
			imagePreview.style.display = 'block';
		};
		reader.readAsDataURL(file);
		return true;
	}

	// Обработка загрузки изображения
	postImageInput.addEventListener('change', function() {
		const file = this.files[0];
		if (file) {
			previewImage(file);
		} else {
			imagePreview.style.display = 'none';
		}
	});

	// Drag & Drop
	if (dropZone) {
		dropZone.addEventListener('dragover', function(e) {
			e.preventDefault();
			dropZone.classList.add('drag-over');
		});
		dropZone.addEventListener('dragleave', function(e) {
			e.preventDefault();
			dropZone.classList.remove('drag-over');
		});
		dropZone.addEventListener('drop', function(e) {
			e.preventDefault();
			dropZone.classList.remove('drag-over');
			const files = e.dataTransfer.files;
			if (files.length > 0) {
				const file = files[0];
				if (previewImage(file)) {
					const dataTransfer = new DataTransfer();
					dataTransfer.items.add(file);
					postImageInput.files = dataTransfer.files;
				}
			}
		});
		dropZone.addEventListener('click', function(e) {
			e.stopPropagation();
			postImageInput.click();
		});
	}

	// Рендер тегов в модальном окне
	function renderTagOptions(tags, selectedTag) {
		const tagList = document.getElementById('tagList');
		if (!tagList) return;
		tagList.innerHTML = '';
		tags.forEach(tag => {
			const option = document.createElement('div');
			option.className = 'tag-option';
			if (selectedTag === tag) option.classList.add('selected');
			option.textContent = tag;
			option.addEventListener('click', function() {
				document.querySelectorAll('.tag-option').forEach(opt => opt.classList.remove('selected'));
				this.classList.add('selected');
				tempSelectedTag = tag;
			});
			tagList.appendChild(option);
		});
	}

	// Обновление отображения выбранного тега
	function updateSelectedDisplay(tag) {
		if (tag && tag !== '') {
			selectBtn.innerHTML = `${tag}`;
			selectBtn.classList.add('selected');
			hiddenInput.value = tag;
			tagWarning.style.display = 'none';
			if (tagWarning) tagWarning.style.display = 'none';
		} else {
			selectBtn.innerHTML = `Выбрать тег`;
			selectBtn.classList.remove('selected');
			hiddenInput.value = '';
			if (tagWarning) tagWarning.style.display = 'none';
		}
	}

	// Управление модальным окном
	const tagOverlay = document.getElementById('tagOverlay');
	const closeTagOverlayBtn = document.getElementById('closeTagOverlayBtn');
	const confirmTagBtn = document.getElementById('confirmTagBtn');

	function openTagOverlay() {
		const currentTag = hiddenInput.value;
		tempSelectedTag = currentTag || null;
		renderTagOptions(availableTags, tempSelectedTag);
		tagOverlay.classList.add('active');
	}

	function closeTagOverlay() {
		tagOverlay.classList.remove('active');
		tempSelectedTag = null;
	}

	function confirmTag() {
		if (tempSelectedTag) {
			updateSelectedDisplay(tempSelectedTag);
		}
		closeTagOverlay();
	}

	selectBtn.addEventListener('click', openTagOverlay);
	if (closeTagOverlayBtn) closeTagOverlayBtn.addEventListener('click', closeTagOverlay);
	if (confirmTagBtn) confirmTagBtn.addEventListener('click', confirmTag);
	if (tagOverlay) {
		tagOverlay.addEventListener('click', function(e) {
			if (e.target === tagOverlay) closeTagOverlay();
		});
	}

	// Предложение тега через AI
	if (suggestTagBtn) {
		suggestTagBtn.addEventListener('click', async function() {
			const btn = suggestTagBtn;
			const title = document.getElementById('postTitle').value.trim();
			const description = document.getElementById('postText').value.trim();

			btn.disabled = true;
			btn.textContent = 'Подбираю...';
			selectBtn.innerHTML = 'Подбираю тег...';
			selectBtn.classList.add('selected');
			try {
				let response = await fetch('/suggest_tag/', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
						'X-Requested-With': 'XMLHttpRequest'
					},
					body: JSON.stringify({ title: title, description: description })
				});
				let data = await response.json();
				const tag = data.tag || 'Другое';
				if (tag && tag !== '') {
					updateSelectedDisplay(tag);
				} else {
					updateSelectedDisplay('');
				}
			} catch (error) {
				console.error('AI tag error:', error);
				tagWarning.style.display = 'block';
				tagWarning.innerHTML = 'Не удалось подобрать тег';
				updateSelectedDisplay('Другое');
			}

			btn.disabled = false;
			btn.textContent = 'Предложить тег';
		});
	}

	// Валидация и отправка формы
	submitBtn.addEventListener('click', function(e) {
		const selectedTag = hiddenInput.value;
		if (!selectedTag || selectedTag === '') {
			e.preventDefault();
			if (tagWarning) tagWarning.style.display = 'block';
			setTimeout(function() {
				if (tagWarning) tagWarning.style.display = 'none';
			}, 3000);
		} else {
			createPostForm.submit();
		}
	});

	// Загрузка тегов при старте
	async function loadTags() {
		availableTags = await get_available_tags();
		if (savedTagValue && savedTagValue !== '') {
			updateSelectedDisplay(savedTagValue);
		} else {
			updateSelectedDisplay('');
		}
	}
	loadTags();
</script>
</body>
</html>
