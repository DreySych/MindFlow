<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Создание поста</title>
	{% load static %}
	{% load custom_filters %}
	<link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
	<link rel="stylesheet" href="{% static 'css/theme.css' %}">
	<link rel="stylesheet" href="{% static 'css/post.css' %}">
	<link rel="stylesheet" href="{% static 'css/comments.css' %}">
	<link rel="stylesheet" href="{% static 'css/complain.css' %}">
	<link rel="stylesheet" href="{% static 'css/basic.css' %}">
	<link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
	<style>
		.post-form-title {
			font-size: 32px;
			margin-bottom: 30px;
			color: var(--text-primary);
			font-family: 'Mallanna', sans-serif;
		}
		.form-group {
			margin-bottom: 25px;
		}
		.form-label {
			display: block;
			margin-bottom: 10px;
			font-size: 16px;
			font-weight: 600;
			color: var(--text-primary);
		}
		.form-input, .form-textarea {
			width: 100%;
			padding: 12px;
			border: 2px solid var(--border-primary);
			border-radius: 8px;
			font-size: 16px;
			box-sizing: border-box;
			background: var(--bg-secondary);
			color: var(--text-primary);
			font-family: inherit;
			transition: border-color 0.2s ease;
		}
		.form-input:focus, .form-textarea:focus {
			outline: none;
			border-color: var(--accent-primary);
			background: var(--bg-primary);
		}
		.form-textarea {
			resize: vertical;
			min-height: 120px;
		}
		.image-upload-area {
			position: relative;
		}
		.image-upload-label {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 30px;
			border: 2px dashed var(--border-primary);
			border-radius: 8px;
			cursor: pointer;
			background-color: var(--bg-secondary);
			transition: all 0.2s ease;
			color: var(--text-secondary);
		}
		.image-upload-label:hover {
			border-color: var(--accent-primary);
			background-color: var(--bg-hover);
			color: var(--text-primary);
		}
		.image-preview {
			margin-top: 10px;
			width: 100%;
			height: auto;
			border-radius: 8px;
			max-height: 400px;
			object-fit: cover;
		}
		.form-actions {
			display: flex;
			justify-content: flex-end;
		}
		.submit-btn {
			padding: 10px 24px;
			background-color: var(--accent-primary);
			color: var(--text-primary);
			border: none;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			font-family: inherit;
			transition: background-color 0.2s ease;
		}
		.submit-btn:hover {
			background-color: var(--accent-secondary);
		}
	</style>
</head>
<body>
{% include 'header.html' %}
{% include 'body.html' %}

<div class="content-wrapper">
	<main>
		<div class="feed">
			<article class="post-detail-card">
				<h1 class="post-form-title">{% if is_edit %}
					Редактировать пост
					{% else %}
					Создать пост
					{% endif %}
				</h1>

				<form id="createPostForm" method="POST" enctype="multipart/form-data">
					{% csrf_token %}

					<div class="form-group">
						<label for="postTitle" class="form-label">
							Заголовок
						</label>

						<input
								type="text"
								id="postTitle"
								name="title"
								maxlength="200"
								required
								value="{{ form.title.value|default:'' }}"
								class="form-input"
						>
					</div>

					<div class="form-group">
						<label for="postImage" class="form-label">Добавить изображение</label>
						<div class="image-upload-area">
							<label for="postImage" class="image-upload-label">
								<span>Нажмите для загрузки или перетащите изображение</span>
							</label>
							<input
									type="file"
									id="postImage"
									name="images"
									accept="image/*"
									multiple
									style="display: none;"
							>
							<img id="imagePreview"
								 src="{% if is_edit and question_images %}/media/{{ question_images.0 }}{% endif %}"
								 class="image-preview"
								 style="display: {% if is_edit and question_images %}block{% else %}none{% endif %};"
								 alt="Предпросмотр">
						</div>
					</div>

					<div class="form-group">
						<label for="postText" class="form-label">Текстовая область</label>
						<textarea
								id="postText"
								name="description"
								maxlength="5000"
								class="form-textarea"
						>{{ form.description.value|default:'' }}</textarea>
					</div>


					<div class="tag-section">
						<label class="form-label">Тег</label>
						<div class="tag-buttons">
							<button type="button" id="openTagOverlayBtn" class="suggest-tag-btn">Выбрать тег</button>
							<button type="button" id="define_tag" class="suggest-tag-btn">Предложить тег</button>
						</div>
						<div id="tagWarning" class="tag-warning" style="display: none;">Выберите тег для поста</div>
						<input type="hidden" id="selectedTag" name="tag" value="{{ question.tag|default:'' }}">
					</div>

					<div class="form-actions">
						<button type="submit" class="submit-btn">{% if is_edit %}
							Сохранить
							{% else %}
							Опубликовать
							{% endif %}
						</button>
					</div>
				</form>
			</article>
		</div>
	</main>
</div>

{% include 'footer.html' %}

<script>
	async function get_available_tags() {
    try {
        const response = await fetch('/get_tags/');

        if (!response.ok) {
            throw new Error('Ошибка');
        }

        const data = await response.json();
        console.log(data);

        return data;
    } catch (error) {
        console.error('Что-то пошло не так:', error);
    }
}
	const selectBtn = document.getElementById('openTagOverlayBtn');
	const hiddenInput = document.getElementById('selectedTag');
	const tagWarning = document.getElementById('tagWarning');
	selectBtn.addEventListener('click', async function() {
    const tags = await get_available_tags();

    let oldOverlay = document.getElementById('tagOverlay');

    if (oldOverlay) {
        oldOverlay.remove();
    }

    const overlay = document.createElement('div');
    overlay.id = 'tagOverlay';

    overlay.style.position = 'fixed';
    overlay.style.top = '50%';
    overlay.style.left = '50%';
    overlay.style.transform = 'translate(-50%, -50%)';
    overlay.style.background = 'white';
    overlay.style.padding = '20px';
    overlay.style.borderRadius = '12px';
    overlay.style.zIndex = '9999';
    overlay.style.display = 'flex';
    overlay.style.flexDirection = 'column';
    overlay.style.gap = '10px';

    tags.forEach(function(tag) {
        const tagButton = document.createElement('button');

        tagButton.type = 'button';
        tagButton.textContent = tag;

        tagButton.addEventListener('click', function() {
            selectBtn.innerHTML = tag;
            selectBtn.classList.add('selected');
            hiddenInput.value = tag;

            if (tagWarning) {
                tagWarning.style.display = 'none';
            }

            overlay.remove();
        });

        overlay.appendChild(tagButton);
    });

    document.body.appendChild(overlay);
});
	document.getElementById('define_tag').addEventListener('click', async function() {
    const btn = document.getElementById('define_tag');

    const title = document.getElementById('postTitle').value.trim();
    const description = document.getElementById('postText').value.trim();


    btn.disabled = true;
    btn.textContent = 'Подбираю...';

    btn.disabled = true;
btn.textContent = 'Подбираю...';

try {
    let response = await fetch('/suggest_tag/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({
            title: title,
            description: description
        })
    });

    let data = await response.json();
	const tag = data.tag || 'Другое';
    if (tag && tag !== '') {
        selectBtn.innerHTML = `${tag}`;
        selectBtn.classList.add('selected');
        hiddenInput.value = tag;
        if (tagWarning) tagWarning.style.display = 'none';
    } else {
        selectBtn.innerHTML = `Выбрать тег`;
        selectBtn.classList.remove('selected');
        hiddenInput.value = '';
        if (tagWarning) tagWarning.style.display = 'none';
    }

} catch (error) {
    console.error('AI tag error:', error);
    hiddenInput.value = 'Другое';
	selectBtn.innerHTML = 'Другое';
	selectBtn.classList.add('selected');
}

btn.disabled = false;
btn.textContent = 'Предложить тег';
});


	const postImage = document.getElementById('postImage');
	const imagePreview = document.getElementById('imagePreview');

	postImage.addEventListener('change', function() {
		const file = this.files[0];

		if (!file) {
			imagePreview.style.display = 'none';
			return;
		}

		imagePreview.src = URL.createObjectURL(file);
		imagePreview.style.display = 'block';
	});
</script>
</body>
</html>
