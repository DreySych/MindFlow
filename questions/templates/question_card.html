{% load static %}

<article class="question-card" id="question-{{ question.id }}">
    <div class="question-card-content">

        <div class="user-info">
            <a href="{% url 'profile_general' username=question.author.username %}" class="user-avatar-link">

                {% if question.author.image %}
                    <img src="{{ question.author.image.url }}" class="user-avatar" alt="Аватар">
                {% else %}
                    <img src="{% static 'images/default.png' %}" class="user-avatar" alt="Аватар">
                {% endif %}

            </a>

            <a href="{% url 'profile_general' username=question.author.username %}" class="user-name-link">
                {{ question.author.username }}
            </a>

            <span class="time-ago">
                {{ question.created_at }}
            </span>
        </div>

        <p class="question-text">
            {{ question.title }}
        </p>

        {% if question_images %}
            <div class="question-image-placeholder">
                <img src="/media/{{ question_images.0 }}" alt="Изображение">
            </div>
        {% endif %}

        <div class="actions">

            <div class="vote-group gradient-border">

                <a href="{% url 'like' %}?id={{ question.id }}" class="vote-btn upvote">
                    <img src="{% static 'images/like.png' %}" alt="Лайк">
                </a>

                <span class="vote-count">
                    {{ question.rating }}
                </span>

                <a href="{% url 'dislike' %}?id={{ question.id }}" class="vote-btn downvote">
                    <img src="{% static 'images/dislike.png' %}" alt="Дизлайк">
                </a>

            </div>

            <a href="{% url 'question' question.id %}"
               class="action-btn comment gradient-border"
               style="text-decoration:none; display:inline-flex; align-items:center;">

                <img src="{% static 'images/comment.png' %}" alt="Комментарий">

                <span>
                    {{ comments|length }}
                </span>
            </a>

            <div style="flex:1;"></div>

            <button class="action-btn cross gradient-border">
                <img src="{% static 'images/krest.png' %}" alt="">
            </button>

            <button class="action-btn report gradient-border">
                <img src="{% static 'images/report.png' %}" alt="">
            </button>

        </div>
    </div>
</article>
