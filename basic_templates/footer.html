<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .footer {
            background-color: #171717;
            border-top: 2px solid #858DB4;
            width: 100%;
            min-height: 70px;
            position: relative;
        }

        .footer-text {
            font-family: 'Holtwood One SC', serif;
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }
    </style>
</head>
<body>
    <div></div>

    <div class="footer">
        <div class="footer-text">®KShP</div>
    </div>
</body>
</html>
