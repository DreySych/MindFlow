{% load static %}
{% load custom_filters %}
<div class="notifications-overlay" id="notificationsOverlay">
  <div class="notifications-header">
    <span class="notifications-title">Уведомления</span>
  </div>
  <div class="notifications-list">
    {% for notification in notifications %}

    <a href="{{ notification.link }}" class="notification-item">

      <img src="{% static 'images/default.png' %}" alt="Аватар" class="notification-avatar">

      <div class="notification-content">

        <p class="notification-text">
          {{ notification.text }}
        </p>

        <span class="notification-time">
          {{ notification.created_at|smart_time }}
        </span>

      </div>

    </a>

    {% empty %}

    <div class="notification-item">
      <div class="notification-content">
        <p class="notification-text">
          Уведомлений пока нет
        </p>
      </div>
    </div>

    {% endfor %}
  </div>
</div>
