{% load static %}
<link rel="stylesheet" href="{% static 'css/basic.css' %}">
<link rel="stylesheet" href="{% static 'css/chat_overlay.css' %}">

<div class="body-sidebar">
  <div class="sidebar-search">
    <input type="text" placeholder="Поиск друзей..." class="sidebar-search-input" id="friendSearchInput">
  </div>

  {% for subscription in subscriptions %}
      <div class="friend-item">
          <img src="{% static 'images/default.png' %}" alt="">
          <span>{{ subscription.user2.username }}</span>

          <a href="{% url 'chat_page' subscription.user2.id %}">
              <img src="{% static 'images/chat.png' %}" alt="Чат">
          </a>
      </div>
  {% empty %}
      <p>Друзей пока нет</p>
  {% endfor %}

  <div class="sidebar-divider"></div>
</div>

{% include 'PM.html' %}

<script src="{% static 'js/sidebar_search.js' %}"></script>

<script>
  function openChatOverlay() {
    document.getElementById('chatOverlay').classList.add('active');
    document.body.style.overflow = '';
    localStorage.setItem('chatOpen', 'true');
  }

  function closeChatOverlay() {
    document.getElementById('chatOverlay').classList.remove('active');
    document.body.style.overflow = '';
    localStorage.removeItem('chatOpen');
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('chatOpen') === 'true') {
      document.getElementById('chatOverlay').classList.add('active');
    }
  });
</script>
