{% load static %}
{% load custom_filters %}
<link rel="stylesheet" href="{% static 'css/basic.css' %}">
<link rel="stylesheet" href="{% static 'css/chat_overlay.css' %}">

<div class="body-sidebar">
  <div class="sidebar-search">
    <input type="text" placeholder="Поиск друзей..." class="sidebar-search-input" id="friendSearchInput">
  </div>

  <div class="friends-list">
    {% for subscription in subscriptions %}
      <div class="friend-item">
        {% if subscription.user2.image %}
          <img src="{{ subscription.user2.image.url }}" alt="" class="friend-avatar">
        {% else %}
          <img src="{% static 'images/default.png' %}" alt="" class="friend-avatar">
        {% endif %}
        <a href="{% url 'profile_general' username=subscription.user2.username %}" class="friend-button">
          <span class="friend-nick">{{ subscription.user2.username }}</span>
        </a>
        <button type="button"
                class="chat-button"
                onclick="openChatOverlay({{ subscription.user2.id }}, '{{ subscription.user2.username }}')">
            <img src="{% static 'images/chat.png' %}" alt="Чат" class="chat-icon">
        </button>
      </div>
    {% empty %}
      <p style="padding: 12px; color: #888; font-family: 'Mallanna', sans-serif;">Друзей пока нет</p>
    {% endfor %}
  </div>

  <div class="sidebar-divider"></div>
</div>

{% include 'PM.html' %}

<script src="{% static 'js/sidebar_search.js' %}"></script>
