{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/basic.css' %}">
<link rel="stylesheet" href="{% static 'css/overlays_basic.css' %}">
<link rel="stylesheet" href="{% static 'css/notifications.css' %}">
<header>
  <a href="{% url 'index' %}" class="header-logo">
    <img src="{% static 'images/logo.png' %}" alt="Логотип" class="logo-img">
    <span class="logo-text">MindFlow</span>
  </a>

  <div class="header-search">
    <div class="search-wrapper" onclick="toggleSearchOverlay(event)">
      <input type="text" placeholder="Поиск..." id="searchInput">
      <span class="search-divider"></span>
      <button>
        <img src="{% static 'images/loop.png' %}" alt="Поиск" class="icon-lupa">
      </button>
    </div>
    <a href="" class="ii-button">
      <span class="ii-text">ИИ Поиск</span>
      <img src="{% static 'images/lamp.png' %}" alt="ИИ" class="icon-ii">
    </a>

    {% include 'search_overlay.html' %}
  </div>

  <div class="header-right">
    <a href="{% url 'make_question' %}" class="create-button">
      <span class="icon-plus">+</span>
      <span>Создать</span>
    </a>

    <div class="notifications-dropdown">
      <button class="icon-button notifications-trigger" onclick="toggleNotificationsOverlay(event)">
        <img src="{% static 'images/notifications.png' %}" alt="Уведомления" class="icon-notify">
      </button>
      {% include 'notifications_overlay.html' %}
    </div>

    <div class="profile-dropdown">
      <button class="icon-button profile-trigger" onclick="toggleProfileOverlay()">
        <img src="https://images.steamusercontent.com/ugc/2476495466522613326/13A264827AD7E9EA5BE7D1619EF6E445E1B7296C/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" alt="Профиль" class="icon-profile">
      </button>

      <div class="profile-overlay" id="profileOverlay">
        <a href="{% url 'profile' %}" class="overlay-item">
          <span>Профиль</span>
        </a>
        <a href="{% url 'complains_panel' %}" class="overlay-item">
          <span>Панель жалоб</span>
        </a>
        <a href="" class="overlay-item">
          <span>Настройки</span>
        </a>
        <a href="{% url 'login' %}" class="overlay-item overlay-item-exit">
          <span>Выйти</span>
        </a>
      </div>
    </div>
  </div>
</header>

<script>
  function toggleProfileOverlay() {
    document.getElementById('profileOverlay').classList.toggle('active');
    document.getElementById('searchOverlay').classList.remove('active');
  }

  function toggleSearchOverlay(event) {
    event.stopPropagation();
    document.getElementById('searchOverlay').classList.toggle('active');
    document.getElementById('profileOverlay').classList.remove('active');
  }

  function toggleNotificationsOverlay(event) {
    event.stopPropagation();
    document.getElementById('notificationsOverlay').classList.toggle('active');
    document.getElementById('profileOverlay').classList.remove('active');
  }

  document.addEventListener('click', function(event) {
    const profileDropdown = document.querySelector('.profile-dropdown');
    const notificationsDropdown = document.querySelector('.notifications-dropdown');

    if (!profileDropdown.contains(event.target)) {
      document.getElementById('profileOverlay').classList.remove('active');
    }
    if (!notificationsDropdown.contains(event.target)) {
      document.getElementById('notificationsOverlay').classList.remove('active');
    }
  });
</script>
