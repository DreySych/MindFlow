{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Mallanna&display=swap" rel="stylesheet">
<header>
  <a href="{% url 'index' %}" class="header-logo">
    <img src="{% static 'images/logo.png' %}" alt="Логотип" class="logo-img">
    <span class="logo-text">MindFlow</span>
  </a>

  <div class="header-search">
    <div class="search-wrapper">
      <input type="text" placeholder="Поиск...">
      <span class="search-divider"></span>
      <button>
        <img src="{% static 'images/loop.png' %}" alt="Поиск" class="icon-lupa">
      </button>
    </div>
    <a href="" class="ii-button">
      <span class="ii-text">ИИ Поиск</span>
      <img src="{% static 'images/lamp.png' %}" alt="ИИ" class="icon-ii">
    </a>
  </div>

  <div class="header-right">
    <a href="{% url 'make_question' %}" class="create-button">
      <span class="icon-plus">+</span>
      <span>Создать</span>
    </a>
    <a href="{% url 'notifications' %}" class="icon-button">
      <img src="{% static 'images/notifications.png' %}" alt="Уведомления" class="icon-notify">
    </a>
    <a href="{% url 'profile' %}" class="icon-button">
      <img src="https://images.steamusercontent.com/ugc/2476495466522613326/13A264827AD7E9EA5BE7D1619EF6E445E1B7296C/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" alt="Профиль" class="icon-profile">
    </a>
  </div>
</header>
