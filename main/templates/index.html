{% block content %}
<h1><a href="{% url 'profile_general' %}"> {{ username }}</a></h1>

    <h2>Зарегистрированные пользователи:</h2>
    <ul>
        {% for user in users %}
            <li>
                {{ user.username }}
                {% if user.email %}- {{ user.email }}{% endif %}
            </li>
        {% endfor %}
    </ul>
{% endblock %}

<a href={{link1}}>{{page1}}</a>
<a href={{link2}}>{{page2}}</a>
